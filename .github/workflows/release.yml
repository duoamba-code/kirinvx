# Membuat GitHub Release berisi jar saat Anda memberi tag versi:  git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    uses: ./.github/workflows/reusable-gradle-build.yml
    with:
      artifact-name: release-jar
      gradle-version: '9.2.1'

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-jar
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
